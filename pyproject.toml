# Makes the book's shared utilities importable as `pyba` from any directory
# once installed with:  pip install -e .   (run from this directory, i.e. the
# book root). See ENV_GUIDE.md.
#
# We deliberately use a real installable package rather than a sys.path hack so
# that `from pyba.data import load_orders` works identically when a student
# runs a notebook, when Quarto executes it during a render, and when code is
# run from the terminal. It is also the same good practice the book teaches.

[project]
name = "pyba"
version = "0.1.0"
description = "Shared utilities for the book: Python for Business Analytics"
requires-python = ">=3.11"
# Runtime dependencies are managed by the conda env file in envs/, not here.
# This package itself is pure glue and pins nothing.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyba"]
