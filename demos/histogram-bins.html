<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Histogram bin width explorer</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 12px 14px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--bs-body-color, #1f2328);
    background: var(--bs-body-bg, transparent);
    font-size: 14px;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #d0d4da; }
    .hint { color: #8a919c; }
  }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .readout { font-variant-numeric: tabular-nums; }
  .hint { color: var(--bs-secondary-color, #57606a); font-size: 12.5px; }
  input[type=range] { width: 220px; accent-color: #0969da; }
  button {
    font: inherit; padding: 3px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--bs-border-color, #d0d7de);
    background: var(--bs-tertiary-bg, #f6f8fa); color: inherit;
  }
  canvas { width: 100%; height: auto; display: block; }
  .blue { color: #0969da; } .red { color: #cf222e; } .purple { color: #8250df; } .amber { color: #bf8700; }
  label { user-select: none; }
</style>
</head>
<body>
<div class="row">
  <label>Bin width: $<span id="bwv" class="readout">50</span></label>
  <input type="range" id="bw" min="10" max="250" step="5" value="50">
  <span class="readout">mean <b class="blue">$<span id="meanv"></span></b> ·
        median <b class="red">$<span id="medv"></span></b></span>
</div>
<canvas id="cv"></canvas>
<p class="hint">600 real Prairie Wholesale order totals. Drag the slider. Small bins show noise;
very wide bins hide the distribution's shape. The mean sits to the right of the median at
every bin width, because the skew is in the data. The bin width changes only the clarity
of the picture.</p>
<script>

function setupCanvas(id, cssH) {
  const c = document.getElementById(id);
  const dpr = window.devicePixelRatio || 1;
  const cssW = c.parentElement.clientWidth;
  c.width = cssW * dpr; c.height = cssH * dpr;
  c.style.width = cssW + 'px'; c.style.height = cssH + 'px';
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [ctx, cssW, cssH];
}
function themeColors() {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  return {
    axis: dark ? '#8a919c' : '#57606a',
    text: dark ? '#d0d4da' : '#1f2328',
    bar:  dark ? 'rgba(88,166,255,0.55)' : 'rgba(9,105,218,0.45)',
    barEdge: dark ? '#58a6ff' : '#0969da',
    grid: dark ? 'rgba(139,148,158,0.15)' : 'rgba(87,96,106,0.12)',
  };
}

const mean = DATA.reduce((a,b)=>a+b,0)/DATA.length;
const sorted = [...DATA].sort((a,b)=>a-b);
const median = (sorted[299]+sorted[300])/2;
document.getElementById('meanv').textContent = mean.toFixed(0);
document.getElementById('medv').textContent = median.toFixed(0);
const XMAX = 1500;
function draw() {
  const bw = +document.getElementById('bw').value;
  document.getElementById('bwv').textContent = bw;
  const [ctx, W, H] = setupCanvas('cv', 300);
  const col = themeColors();
  const L = 40, R = 10, T = 10, B = 28;
  ctx.clearRect(0, 0, W, H);
  const nbins = Math.ceil(XMAX / bw);
  const counts = new Array(nbins).fill(0);
  for (const v of DATA) counts[Math.min(nbins-1, Math.floor(v/bw))]++;
  const ymax = Math.max(...counts) * 1.08;
  const x = v => L + (W-L-R) * v / XMAX;
  const y = c => T + (H-T-B) * (1 - c/ymax);
  // grid + axes
  ctx.strokeStyle = col.grid;
  ctx.beginPath();
  for (let gx = 0; gx <= XMAX; gx += 250) { ctx.moveTo(x(gx), T); ctx.lineTo(x(gx), H-B); }
  ctx.stroke();
  // bars
  ctx.fillStyle = col.bar; ctx.strokeStyle = col.barEdge;
  for (let i = 0; i < nbins; i++) {
    if (!counts[i]) continue;
    const x0 = x(i*bw), x1 = x(Math.min((i+1)*bw, XMAX));
    ctx.fillRect(x0, y(counts[i]), x1-x0-1, H-B-y(counts[i]));
  }
  // mean / median markers
  for (const [v, c, lbl] of [[mean, '#0969da', 'mean'], [median, '#cf222e', 'median']]) {
    ctx.strokeStyle = c; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x(v), T); ctx.lineTo(x(v), H-B); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.fillStyle = c; ctx.font = '12px sans-serif';
    ctx.fillText(lbl, x(v)+4, T+12 + (lbl==='median'?14:0));
  }
  // x labels
  ctx.fillStyle = col.axis; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
  for (let gx = 0; gx <= XMAX; gx += 250) ctx.fillText('$'+gx, x(gx), H-10);
  ctx.textAlign = 'left';
}
document.getElementById('bw').addEventListener('input', draw);
window.addEventListener('resize', draw);
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
draw();
</script>
</body></html>
