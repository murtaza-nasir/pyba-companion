const LT = v => Math.log10(v);
const TMIN = LT(3), TMAX = LT(2000);
function fit(points) {
  const n = points.length;

  for (const p of points) { const yy = LT(p.t); sx+=p.d; sy+=yy; sxy+=p.d*yy; sx2+=p.d*p.d; }
