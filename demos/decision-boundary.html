<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Decision boundary explorer</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 12px 14px; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         color: var(--bs-body-color, #1f2328); background: var(--bs-body-bg, transparent); font-size: 14px; }
  @media (prefers-color-scheme: dark) { body { color: #d0d4da; } .hint { color: #8a919c; } }
  .row { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; margin-bottom: 8px; }
  .readout { font-variant-numeric: tabular-nums; }
  .hint { color: var(--bs-secondary-color, #57606a); font-size: 12.5px; margin: 6px 0 0; }
  input[type=range] { width: 170px; accent-color: #0969da; }
  button { font: inherit; padding: 3px 12px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--bs-border-color, #d0d7de);
           background: var(--bs-tertiary-bg, #f6f8fa); color: inherit; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 420px) { .panes { grid-template-columns: 1fr; } }
  .pane-title { font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
  canvas { width: 100%; height: auto; display: block; touch-action: none; }
  .blue { color: #0969da; } .red { color: #cf222e; } .purple { color: #8250df; } .amber { color: #bf8700; }
  @media (prefers-color-scheme: dark) {
    button, select { background: #21262d; border: 1px solid #3d444d; color: #e6edf3; }
    button:hover { background: #30363d; }
    .blue { color: #4493f8; } .red { color: #f47067; }
  }
</style>
</head>
<body>

<div class="row">
  <button id="place">Place a new customer</button>
  <span class="hint" style="margin:0">or click anywhere on the chart</span>
</div>
<div class="legend">
  <span><i class="dot" style="background:var(--stay)"></i>stayed</span>
  <span><i class="dot" style="background:var(--churn)"></i>churned</span>
  <span><i class="ring"></i>new customer</span>
  <span><i class="bar"></i>orders = 2.5 &times; weeks &minus; 12</span>
</div>
<div><canvas id="cv"></canvas></div>
<div class="card" id="card"></div>
<style>
  :root { --stay: #0969da; --churn: #cf222e; --ink: #1f2328; }
  @media (prefers-color-scheme: dark) { :root { --stay: #4493f8; --churn: #f47067; --ink: #e6edf3; } }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; margin: 2px 0 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .ring { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 2px solid var(--ink); }
  .bar { width: 18px; height: 0; border-top: 2px solid var(--ink); display: inline-block; }
  .card { margin-top: 8px; padding: 8px 12px; border-radius: 8px; font-variant-numeric: tabular-nums;
          border: 1px solid var(--bs-border-color, #d0d7de); line-height: 1.6; min-height: 4.8em; }
  .card .verdict { font-weight: 600; }
  .card .churn { color: var(--churn); } .card .stay { color: var(--stay); }
</style>
<script>

function setupCanvas(c, cssH) {
  const dpr = window.devicePixelRatio || 1;
  const cssW = c.parentElement.clientWidth;
  c.width = cssW * dpr; c.height = cssH * dpr;
  c.style.width = cssW + 'px'; c.style.height = cssH + 'px';
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [ctx, cssW, cssH];
}
function theme() {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  return { axis: dark ? '#8a919c' : '#57606a', text: dark ? '#d0d4da' : '#1f2328',
           grid: dark ? 'rgba(139,148,158,0.15)' : 'rgba(87,96,106,0.12)',
           blue: dark ? '#4493f8' : '#0969da', red: dark ? '#f47067' : '#cf222e',
           purple: '#8250df', amber: '#bf8700',
           stay: dark ? 'rgba(68,147,248,0.45)' : 'rgba(9,105,218,0.38)',
           churn: dark ? 'rgba(244,112,103,0.70)' : 'rgba(207,34,46,0.62)' };
}

const $ = id => document.getElementById(id);
const XMAX = 20, YMAX = 30;
const PTS = [[1, 20, 0], [2, 14, 0], [3, 22, 0], [2, 8, 0], [4, 17, 0], [5, 25, 0], [6, 19, 0], [3, 4, 0],
  [7, 24, 0], [8, 22, 0], [5, 11, 0], [9, 27, 0], [1, 3, 0], [8, 9, 0], [10, 15, 0],
  [7, 2, 1], [8, 5, 1], [10, 8, 1], [12, 8, 1], [12, 17, 1], [14, 18, 1], [15, 12, 1],
  [13, 4, 1], [16, 22, 1], [18, 16, 1], [17, 7, 1], [9, 2, 1], [6, 8, 1], [11, 12, 0]];
const line = w => 2.5 * w - 12;
let pad, geom, current = null, earlier = [], pulse = 0;
const predict = (w, o) => o < line(w) ? 1 : 0;

function draw() {
  const c = theme(), dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const cv = $('cv'), w = cv.parentElement.clientWidth;
  const [ctx, W, H] = setupCanvas(cv, Math.round(Math.min(360, Math.max(240, w * 0.6))));
  pad = { l: 40, r: 10, t: 8, b: 36 }; geom = { W, H };
  const X = x => pad.l + x / XMAX * (W - pad.l - pad.r), Y = y => H - pad.b - y / YMAX * (H - pad.t - pad.b);
  const stayFill = dark ? '#18273a' : '#e4eefa', churnFill = dark ? '#3a2226' : '#f8dede';
  const ink = dark ? '#e6edf3' : '#1f2328';
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = stayFill; ctx.fillRect(X(0), Y(YMAX), X(XMAX) - X(0), Y(0) - Y(YMAX));
  ctx.fillStyle = churnFill; ctx.beginPath();            // the churn region: below the line
  ctx.moveTo(X(4.8), Y(0)); ctx.lineTo(X(16.8), Y(30)); ctx.lineTo(X(20), Y(30)); ctx.lineTo(X(20), Y(0)); ctx.closePath(); ctx.fill();
  ctx.font = '600 12px sans-serif'; ctx.textAlign = 'left';
  ctx.fillStyle = dark ? 'rgba(244,112,103,0.85)' : 'rgba(207,34,46,0.75)'; ctx.fillText('predicted churn', X(15.2), Y(2.2));
  ctx.fillStyle = dark ? 'rgba(68,147,248,0.85)' : 'rgba(9,105,218,0.75)'; ctx.fillText('predicted stay', X(0.6), Y(28));
  ctx.strokeStyle = c.grid; ctx.lineWidth = 1; ctx.font = '11px sans-serif';
  for (const v of [0, 5, 10, 15, 20]) { ctx.fillStyle = c.axis; ctx.textAlign = 'center'; ctx.fillText(v, X(v), H - pad.b + 14); }
  for (const v of [0, 10, 20, 30]) { ctx.fillStyle = c.axis; ctx.textAlign = 'right'; ctx.fillText(v, pad.l - 6, Y(v) + 4); }
  ctx.textAlign = 'center'; ctx.fillText('Weeks since last order', (pad.l + W - pad.r) / 2, H - 4);
  ctx.save(); ctx.translate(11, (pad.t + H - pad.b) / 2); ctx.rotate(-Math.PI / 2); ctx.fillText('Orders, last 12 months', 0, 0); ctx.restore();
  ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(4.8), Y(0)); ctx.lineTo(X(16.8), Y(30)); ctx.stroke();
  for (const [x, y, cl] of PTS) {
    ctx.fillStyle = cl ? c.red : c.blue; ctx.strokeStyle = dark ? '#0d1117' : '#fff'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(X(x), Y(y), 4.5, 0, 7); ctx.fill(); ctx.stroke();
  }
  for (const [x, y] of earlier) {                        // earlier new customers, faded
    ctx.globalAlpha = 0.45; ctx.strokeStyle = predict(x, y) ? c.red : c.blue; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(X(x), Y(y), 6, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  }
  if (current) {
    const [x, y] = current, p = predict(x, y), col = p ? c.red : c.blue;
    ctx.setLineDash([3, 3]); ctx.strokeStyle = ink; ctx.lineWidth = 1;   // vertical guide to the line
    const yl = Math.max(0, Math.min(YMAX, line(x)));
    ctx.beginPath(); ctx.moveTo(X(x), Y(y)); ctx.lineTo(X(x), Y(yl)); ctx.stroke(); ctx.setLineDash([]);
    if (line(x) >= 0 && line(x) <= YMAX) { ctx.fillStyle = ink; ctx.beginPath(); ctx.arc(X(x), Y(yl), 2.5, 0, 7); ctx.fill(); }
    const r = 9 + 6 * pulse;
    ctx.fillStyle = col; ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.arc(X(x), Y(y), r, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = ink; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(X(x), Y(y), 8, 0, 7); ctx.stroke();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(X(x), Y(y), 4, 0, 7); ctx.fill();
    ctx.fillStyle = ink; ctx.font = '600 12px sans-serif'; ctx.textAlign = x > 15 ? 'right' : 'left';
    ctx.fillText('new', X(x) + (x > 15 ? -13 : 13), Y(y) - 8);
  }
}
function fmt(v) { return (Math.round(v * 10) / 10).toFixed(1).replace('-', '\u2212'); }
function describe() {
  if (!current) { $('card').innerHTML = 'Place a new customer to see how the line classifies it.'; return; }
  const [w, o] = current, l = line(w), p = predict(w, o);
  const cls = p ? 'churn' : 'stay', side = p ? 'below' : 'above';
  $('card').innerHTML =
    `New customer: <b>${fmt(w)}</b> weeks since the last order, <b>${o}</b> orders in the last 12 months.<br>` +
    `On the line at ${fmt(w)} weeks: orders = 2.5 &times; ${fmt(w)} &minus; 12 = <b>${fmt(l)}</b>.<br>` +
    `${o} is ${side} ${fmt(l)}, so the customer lands in the ${p ? 'red' : 'blue'} region: ` +
    `<span class="verdict ${cls}">predicted ${p ? 'churn' : 'stay'}</span>.`;
}
function place(w, o) {
  if (current) { earlier.push(current); if (earlier.length > 5) earlier.shift(); }
  current = [w, o]; describe();
  const start = performance.now(), reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { pulse = 0; draw(); return; }
  (function step(t) { const k = Math.min(1, (t - start) / 450); pulse = 1 - k; draw(); if (k < 1) requestAnimationFrame(step); })(start);
}
$('place').addEventListener('click', () => place(Math.round((0.5 + Math.random() * 19) * 10) / 10, Math.round(1 + Math.random() * 28)));
$('cv').addEventListener('pointerdown', e => {
  const r = e.target.getBoundingClientRect(), { W, H } = geom;
  const w = (e.clientX - r.left - pad.l) / (W - pad.l - pad.r) * XMAX, o = (H - pad.b - (e.clientY - r.top)) / (H - pad.t - pad.b) * YMAX;
  if (w < 0 || w > XMAX || o < 0 || o > YMAX) return;
  place(Math.round(w * 10) / 10, Math.round(o));
});
window.addEventListener('resize', draw);
if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
current = [14.2, 10]; describe(); draw();
</script><script>
// report the content height to the book page so the iframe is sized to fit (assets/iframe-resize.html)
(function () {
  function report() {
    var b = document.body, s = getComputedStyle(b);
    parent.postMessage({ pybaDemoHeight: Math.ceil(b.getBoundingClientRect().height
      + parseFloat(s.marginTop) + parseFloat(s.marginBottom)) }, "*");
  }
  new ResizeObserver(report).observe(document.body);
  window.addEventListener("load", report);
  report();
})();
</script>
<script>
// answer the book page's request for this demo's height (sent once the page's listener is ready)
window.addEventListener("message", function (e) {
  if (!e.data || !e.data.pybaDemoPing) return;
  var b = document.body, s = getComputedStyle(b);
  parent.postMessage({ pybaDemoHeight: Math.ceil(b.getBoundingClientRect().height
    + parseFloat(s.marginTop) + parseFloat(s.marginBottom)) }, "*");
});
</script>
</body></html>
